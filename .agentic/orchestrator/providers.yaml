version: 1

providers:
  project_planner:
    engine: gsd
    required: true


  spec_kit:
    engine: github-spec-kit
    required: true

  specification:
    engine: tlc-spec-driven
    required: true

  execution:
    engine: ruflo
    required: false
    fallback: native-agent

  process:
    engine: superpowers
    required: true

  verification:
    engine: tlc-spec-driven
    fresh_context: true
    required: true

  decision_ledger:
    engine: native-adr
    required: true

  domain_skills:
    engine: optional
    auto_select: true
